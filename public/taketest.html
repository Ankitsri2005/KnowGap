<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>knowGap | Take Test</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

  <div class="dashboard-layout" style="display: block; min-height: 100vh;">
    <!-- Top Navigation for Test -->
    <div class="app-top-bar">
      <div class="app-top-bar-title">knowGap Validation</div>
      <button class="btn btn-secondary btn-sm" onclick="window.location.href='student.html'">Exit Test</button>
    </div>

    <!-- Main Content for the Test -->
    <main class="container app-main app-main--narrow" id="app">
      <div class="loading-full">
        <div class="spinner"></div>
        <p>Preparing your evaluation...</p>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/test.js"></script>
  <script>
    const user = JSON.parse(localStorage.getItem('user'));
    const token = localStorage.getItem('token');
    if (!user || !token) window.location.href = "login.html";

    const urlParams = new URLSearchParams(window.location.search);
    const subjectId = urlParams.get('subjectId');
    const subjectName = urlParams.get('subjectName');

    //console.log(46, subjectId+" "+subjectName)

    document.addEventListener("DOMContentLoaded", () => {
      const topics = urlParams.get('topics');
      const limit = urlParams.get('limit');
      Router.params = { subjectId, subjectName, topics, limit };
      renderTakeTest({ subjectId, subjectName, topics, limit });
    });
  </script>

</body>

</html>
