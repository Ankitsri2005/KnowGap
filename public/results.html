<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>knowGap | Test Results</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/results.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

  <div class="dashboard-layout" style="display: block; min-height: 100vh;">
    <!-- Top Navigation for Results -->
    <div style="background: var(--bg-card); padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;">
      <div style="font-family: 'Playfair Display', serif; font-weight: 700; font-size: clamp(1rem, 4vw, 1.2rem);">know<span class="brand-accent">Gap</span> Results</div>
      <button class="btn btn-secondary btn-sm" onclick="window.location.href='student.html'">Back to Dashboard</button>
    </div>

    <div id="toast-container"></div>

  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/results.js"></script>
  <script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user) window.location.href = "login.html";

    // Grab URL params
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('sessionId');

    document.addEventListener("DOMContentLoaded", () => {
      Router.params = { sessionId };
      renderResults({ sessionId });
    });
  </script>
</body>

</html>
