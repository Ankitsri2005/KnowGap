<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>knowGap | Teacher Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <!-- Mobile Header -->
  <header class="mobile-header" id="mobile-header">
    <div class="mobile-header-logo" onclick="window.location.href='index.html'">know<span class="brand-accent">Gap</span></div>
    <button class="mobile-hamburger" id="mob-hamburger" onclick="toggleSidebar()">
      <span></span><span></span><span></span>
    </button>
  </header>

  <!-- Sidebar Backdrop -->
  <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>

  <!-- Right Sidebar Backdrop -->
  <div class="right-sidebar-backdrop" id="right-sidebar-backdrop" onclick="closeRightSidebar()"></div>

  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo" onclick="window.location.href='index.html'">know<span class="brand-accent">Gap</span></div>
      <div class="sidebar-section" data-i18n="teacher_menu_section">Main Menu</div>

      <button class="sidebar-link active" id="nav-dashboard" onclick="switchTeacherTab('dashboard'); closeSidebar();" data-i18n="teacher_nav_dashboard">
        <span class="icon">📊</span> Dashboard
      </button>

      <button class="sidebar-link" id="nav-students" onclick="switchTeacherTab('students'); closeSidebar();" data-i18n="teacher_nav_students">
        <span class="icon">👨‍🎓</span> Students
      </button>

      <button class="sidebar-link" id="nav-questionbank" onclick="switchTeacherTab('questionbank'); closeSidebar();" data-i18n="teacher_nav_questionbank">
        <span class="icon">❓</span> Question Bank
      </button>

      <button class="sidebar-link" id="nav-reports" onclick="switchTeacherTab('reports'); closeSidebar();" data-i18n="teacher_nav_reports">
        <span class="icon">📈</span> Detailed Reports
      </button>

      <div class="sidebar-spacer"></div>
      <div style="padding: 16px 12px; border-top: 1px solid var(--border);">
        <div id="teacher-name" style="font-size: 0.85rem; font-weight: 600; margin-bottom: 4px;">Loading...</div>
        <div style="font-size: 0.75rem; color: var(--text-muted);" data-i18n="teacher_account_label">Teacher Account</div>
        <button class="btn btn-secondary btn-sm btn-full" style="margin-top: 12px;" onclick="logout()" data-i18n="teacher_logout_btn">Logout</button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-wrapper">
      <!-- Top Bar -->
      <header class="top-bar" id="top-bar">
        <div class="top-bar-left">
          <div class="top-bar-logo">know<span class="brand-accent">Gap</span></div>
        </div>
        <div class="top-bar-center">
          <div class="top-bar-search">
            <span class="top-bar-search-icon">🔍</span>
            <input type="text" class="top-bar-search-input" placeholder="Search student name or test ID..." id="global-search" oninput="handleGlobalSearch(this.value)" data-i18n="teacher_search_placeholder">
          </div>
        </div>
        <div class="top-bar-right">
          <button class="top-bar-btn" id="bell-btn" onclick="toggleNotificationPanel()">
            <span class="top-bar-bell">🔔</span>
            <span class="top-bar-bell-dot" id="bell-dot"></span>
          </button>
          <div class="top-bar-profile" id="profile-dropdown-trigger" onclick="toggleProfileDropdown()">
            <div class="top-bar-avatar" id="top-bar-avatar">P</div>
            <span class="top-bar-name" id="top-bar-name">Prof.</span>
            <span class="top-bar-chevron">▾</span>
          </div>
          <!-- Profile Dropdown -->
          <div class="profile-dropdown" id="profile-dropdown">
            <div class="profile-dropdown-header">
              <div class="profile-dropdown-avatar" id="dropdown-avatar">P</div>
              <div>
                <div class="profile-dropdown-name" id="dropdown-name">Prof. Naveen</div>
                <div class="profile-dropdown-role">Teacher</div>
              </div>
            </div>
            <div class="profile-dropdown-divider"></div>
            <button class="profile-dropdown-item" onclick="switchTeacherTab('settings'); closeProfileDropdown()" data-i18n="teacher_settings">⚙️ Settings</button>
            <button class="profile-dropdown-item" onclick="logout()">🚪 Logout</button>
          </div>
          <!-- Notification Panel -->
          <div class="notification-panel" id="notification-panel">
            <div class="notification-panel-header">
              <h4 data-i18n="teacher_notif_title">🔔 Notifications</h4>
            </div>
            <div class="notification-panel-body" id="notification-body">
              <div class="notification-empty" data-i18n="teacher_notif_empty">No new notifications</div>
            </div>
          </div>
        </div>
      </header>

      <!-- Main Content -->
      <main class="main-content" id="main-content">
        <div class="loading-full"><div class="spinner"></div><p data-i18n="teacher_loading">Loading teacher dashboard...</p></div>
      </main>

      <!-- Footer -->
      <footer class="dashboard-footer" id="dashboard-footer">
        <div class="footer-left">
          <span class="footer-brand">know<span class="brand-accent">Gap</span></span>
          <span class="footer-separator">|</span>
          <span class="footer-sync" id="footer-sync" data-i18n="teacher_sync_text">Last synced: just now</span>
        </div>
        <div class="footer-right">
          <span class="footer-badge" data-i18n="teacher_nep_badge">🇮🇳 NEP 2020 Aligned</span>
        </div>
      </footer>
    </div>

    <!-- Right Sidebar (Collapsible) -->
    <aside class="right-sidebar" id="right-sidebar">
      <div class="right-sidebar-header">
        <h4 data-i18n="teacher_right_title">Student Details</h4>
        <button class="right-sidebar-close" onclick="closeRightSidebar()">✕</button>
      </div>
      <div class="right-sidebar-body" id="right-sidebar-body">
        <div class="right-sidebar-empty" data-i18n="teacher_right_empty">Select a student or data point to view details</div>
      </div>
    </aside>
  </div>

  <!-- Floating Action Button -->
  <div class="fab-container" id="fab-container">
    <button class="fab-btn" id="fab-btn" onclick="toggleFAB()">
      <span class="fab-icon">⚡</span>
    </button>
    <div class="fab-menu" id="fab-menu">
      <button class="fab-menu-item" onclick="generateClassReport()" data-i18n="teacher_fab_report">
        <span class="fab-menu-icon">📄</span> Generate Class Report (PDF)
      </button>
      <button class="fab-menu-item" onclick="startLiveQuiz()" data-i18n="teacher_fab_quiz">
        <span class="fab-menu-icon">🎯</span> Start Live Quiz
      </button>
      <button class="fab-menu-item" onclick="openAIHelp()" data-i18n="teacher_fab_ai">
        <span class="fab-menu-icon">🤖</span> Open AI Help
      </button>
    </div>
  </div>

  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/teacher.js"></script>
  <script>
    const user = JSON.parse(localStorage.getItem('user'));
    const token = localStorage.getItem('token');

    if (!user || user.role !== 'teacher' || !token) {
      window.location.href = "login.html";
    } else {
      document.getElementById('teacher-name').innerText = user.name;
      document.getElementById('top-bar-name').innerText = user.name;
      document.getElementById('top-bar-avatar').innerText = user.name.charAt(0).toUpperCase();
      document.getElementById('dropdown-avatar').innerText = user.name.charAt(0).toUpperCase();
      document.getElementById('dropdown-name').innerText = user.name;
    }

    function logout() {
      localStorage.removeItem('user');
      localStorage.removeItem('token');
      window.location.href = "login.html";
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      const hamburger = document.getElementById('mob-hamburger');
      sidebar.classList.toggle('open');
      backdrop.classList.toggle('open');
      hamburger.classList.toggle('open');
      document.body.style.overflow = sidebar.classList.contains('open') ? 'hidden' : '';
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebar-backdrop').classList.remove('open');
      document.getElementById('mob-hamburger').classList.remove('open');
      document.body.style.overflow = '';
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderTeacher();
      updateSyncTime();
      setInterval(updateSyncTime, 30000);
    });
  </script>
</body>
</html>
