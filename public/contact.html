<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | knowGap</title>
  <meta name="description" content="Get in touch with the knowGap team. We're here to help with your learning gap analysis questions.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/contact.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container">
      <a class="navbar-brand" href="index.html">know<span class="brand-accent">Gap</span></a>
      <div class="navbar-menu">
        <a href="index.html" class="nav-item" data-i18n="nav_home">Home</a>
        <a href="about.html" class="nav-item" data-i18n="nav_about">About</a>
        <a href="contact.html" class="nav-item active" data-i18n="nav_contact">Contact</a>
        <a href="developers.html" class="nav-item" data-i18n="nav_devs">Developers</a>
      </div>
      <div class="navbar-links" id="contact-nav-links"></div>
    </div>
  </nav>

  <!-- Hero -->
  <section class="contact-hero">
    <div class="container animate-up">
      <div class="badge badge-info" style="margin-bottom: 16px;" data-i18n="contact_badge">💬 Reach Out</div>
      <h1 class="hero-title" data-i18n="contact_title">Get in <span class="gradient-text">Touch</span></h1>
      <p class="hero-sub" style="max-width: 600px; margin: 16px auto 0;" data-i18n="contact_sub">
        Have questions about the forensic analysis? We're here to help your learning journey.
      </p>
    </div>
  </section>

  <!-- Contact Form -->
  <div class="container">
    <div class="contact-container animate-up">
      <form id="contactForm">
        <div class="contact-group">
          <label data-i18n="contact_name_label">Full Name</label>
          <input type="text" class="contact-control" placeholder="John Doe" data-i18n="contact_name_placeholder" required>
        </div>
        <div class="contact-group">
          <label data-i18n="contact_email_label">Email Address</label>
          <input type="email" class="contact-control" placeholder="john@example.com" data-i18n="contact_email_placeholder" required>
        </div>
        <div class="contact-group">
          <label data-i18n="contact_subject_label">Subject</label>
          <input type="text" class="contact-control" placeholder="What's this about?" data-i18n="contact_subject_placeholder">
        </div>
        <div class="contact-group">
          <label data-i18n="contact_message_label">Message</label>
          <textarea class="contact-control" placeholder="How can we help your learning journey?" data-i18n="contact_message_placeholder"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" data-i18n="contact_submit_btn">✉️ Send Message</button>
      </form>
    </div>

    <!-- Info Cards -->
    <div class="contact-info" style="margin-bottom: 60px;">
      <div class="contact-info-card">
        <div style="font-size: 2rem; margin-bottom: 12px;">📧</div>
        <h3 style="margin-bottom: 6px; font-size: 1rem;" data-i18n="contact_info_email_title">Email</h3>
        <p style="color: var(--text-muted); font-size: 0.85rem;">support@knowgap.ai</p>
      </div>
      <div class="contact-info-card">
        <div style="font-size: 2rem; margin-bottom: 12px;">📍</div>
        <h3 style="margin-bottom: 6px; font-size: 1rem;" data-i18n="contact_info_location_title">Location</h3>
        <p style="color: var(--text-muted); font-size: 0.85rem;">IEM, Kolkata, India</p>
      </div>
      <div class="contact-info-card">
        <div style="font-size: 2rem; margin-bottom: 12px;">⏰</div>
        <h3 style="margin-bottom: 6px; font-size: 1rem;" data-i18n="contact_info_response_title">Response Time</h3>
        <p style="color: var(--text-muted); font-size: 0.85rem;">Within 24 hours</p>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <span class="site-footer-brand" data-i18n="brand_name">know<span class="brand-accent">Gap</span></span>
      <span class="site-footer-copy" data-i18n="footer_copy">IEM kolkata knowGap Forensic System</span>
    </div>
  </footer>

  <div id="toast-container"></div>

  <script src="js/i18n.js"></script>
  <script src="js/mobile-nav.js"></script>
  <script src="js/nav.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      initSiteNav({ navContainerId: 'contact-nav-links', activePage: 'contact' });
      
      document.getElementById('contactForm').onsubmit = function(e) {
        e.preventDefault();
        // Show success message
        var btn = e.target.querySelector('button[type="submit"]');
        btn.innerText = '✅ Message Sent!';
        btn.disabled = true;
        btn.style.background = 'var(--success)';
        setTimeout(function() {
          btn.innerText = '✉️ Send Message';
          btn.disabled = false;
          btn.style.background = '';
          e.target.reset();
        }, 3000);
      };
    });
  </script>
</body>
</html>
