<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>knowGap | Student Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

  <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle" aria-hidden="true" tabindex="-1">

  <header class="mobile-header">
    <div class="mobile-header-logo" onclick="window.location.href='index.html'">know<span class="brand-accent">Gap</span></div>
    <label for="sidebar-toggle" class="mobile-hamburger" aria-label="Open menu">
      <span></span><span></span><span></span>
    </label>
  </header>

  <label for="sidebar-toggle" class="sidebar-backdrop" aria-label="Close menu"></label>

  <div class="dashboard-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo" onclick="window.location.href='index.html'">know<span class="brand-accent">Gap</span></div>
      <div class="sidebar-section">Student Menu</div>

      <a href="student.html" class="sidebar-link active">
        <span class="icon">📊</span> Dashboard
      </a>

      <div class="sidebar-spacer"></div>
      <div class="sidebar-footer">
        <div id="student-name" class="user-name">Loading...</div>
        <div class="user-role">Student Account</div>
        <button class="btn btn-secondary btn-sm btn-full" onclick="logout()">Logout</button>
      </div>
    </aside>

    <main class="main-content" id="main-content">
      <div class="loading-full"><div class="spinner"></div><p>Loading your dashboard...</p></div>
    </main>
  </div>

    <div id="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/student.js"></script>
  <script>
    const user = JSON.parse(localStorage.getItem('user'));

    if (!user || user.role !== 'student') {
      window.location.href = "login.html";
    } else {
      document.getElementById('student-name').innerText = user.name;
    }

    function logout() {
      localStorage.removeItem('user');
      localStorage.removeItem('token');
      window.location.href = "login.html";
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderStudent();
    });
  </script>
</body>

</html>
